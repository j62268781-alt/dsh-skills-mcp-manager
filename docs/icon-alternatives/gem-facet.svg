<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dsh-skills-mcp-manager">
  <title>dsh-skills-mcp-manager（备选：菱形切面）</title>
  <!-- 备选方案：圆角菱形 + 斜向切面（两半不同渐变）。
       规格与正式稿一致：36×36 透明底、自包含渐变、字形高度落在官方 50–61% 区间。
       若要换用，把本文件内容覆盖到 icon.svg 即可。 -->
  <mask id="smpFacet">
    <rect width="36" height="36" fill="#fff" />
    <path d="M-30 -30 46 46 46 -30Z" fill="#000" />
  </mask>
  <path d="M18 9.4 26.6 18 18 26.6 9.4 18Z" fill="url(#smpBlueAlt)" stroke="url(#smpBlueAlt)" stroke-width="3.6" stroke-linejoin="round" />
  <path d="M18 9.4 26.6 18 18 26.6 9.4 18Z" fill="url(#smpTealAlt)" stroke="url(#smpTealAlt)" stroke-width="3.6" stroke-linejoin="round" mask="url(#smpFacet)" />
  <defs>
    <linearGradient id="smpBlueAlt" x1="8" y1="8" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CB7FF" />
      <stop offset="1" stop-color="#145AF3" />
    </linearGradient>
    <linearGradient id="smpTealAlt" x1="11" y1="11" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#52CED8" />
      <stop offset="1" stop-color="#617BEB" />
    </linearGradient>
  </defs>
</svg>

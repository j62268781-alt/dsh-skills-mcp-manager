# 提交给 DSH 插件市场的条目 —— 原样复制到 PR：
#   awesome-dsh-plugin/awesome-dsh-plugin → data/plugins/j62268781-alt__dsh-skills-mcp-manager.yml
#
# 文件名规则 <owner>__<repo>.yml；校验器只认 url / name / category / description / tarball，
# 多写键会被拒；npm 与仓库的对应关系由 CI 从 npm 的 repository 字段自动探测，所以这里没有 npm 字段。
# category 取自既定分类集合；这里用 ui（与同类插件 dsh-mcp-manager-plus 一致），
# 想强调「技能包」也可以改成一个词：skill。
url: https://github.com/j62268781-alt/dsh-skills-mcp-manager
name: j62268781-alt/dsh-skills-mcp-manager
category: ui
description:
  en: 'Manage skills and MCP servers from one DSH settings panel. Skills are read from disk: browse, search, preview the body, create, rename and delete, with a backup written before every removal. Global MCP servers are the real cordis.patch.yml loader rows; per-project entries mount only for sessions in that project. Each expanded card lists the tools that server actually registered, and a per-server allow/deny rule keeps only the ones you need — a blocked tool never enters the tool registry, so it costs no context on every turn. Every MCP card carries a connection status tag (connected with a tool count, retrying, gave up, activation failed, needs authorization) plus a one-click reconnect, so a server that fails at startup is visible instead of silently missing its tools. A server that demands OAuth is labelled as needing authorization rather than as broken — the shipped MCP client has no OAuth support, so its 401 would otherwise be retried like a network fault and finally reported as given up — and the card says how to supply the credential. Imports existing configs from 26 other MCP clients.'
  zh: '在 DSH 设置面板里一站式管理技能与 MCP 服务器。技能以磁盘为准：浏览、搜索、预览正文、新建、重命名、删除，删除前自动写一份备份。全局 MCP 就是 cordis.patch.yml 里的真实 Loader 行，项目级条目只挂到对应项目的会话。展开卡片会列出该服务器实际注册的工具，并可只保留需要的那些——被挡下的工具不进工具注册表，因此不占用每一轮的上下文。每张卡片带连接状态标签（已连接并显示工具数 / 重试中 / 已放弃重试 / 激活失败 / 需要授权）与一键重连，让启动时连不上、工具悄悄消失的服务器看得见。要求 OAuth 的服务器会被标成「需要授权」而不是「坏了」——DSH 自带的 MCP 客户端没有 OAuth 支持，它的 401 本来会被当成网络故障一路重试到放弃——卡片同时说明怎么补上凭据。另可从 26 个 MCP 客户端导入既有配置。'
